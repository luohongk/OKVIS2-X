camera_parameters:
  timestamp_tolerance: 0.075
  sync_cameras: [0, 1, 2, 3]
  image_delay: 0.016343
  online_calibration:
    do_extrinsics: 1
    do_extrinsics_final_ba: 1
    sigma_r: 0.001
    sigma_alpha: 0.005
    sigma_r_final_ba: 0.003
    sigma_alpha_final_ba: 0.016
  deep_stereo_indices: [0, 1]
  fov_scale: 0.9

imu_parameters:
  use: 1
  a_max: 176.0
  g_max: 7.8
  sigma_g_c: 6.26e-03   # gyroscope_noise_density from imu.yaml
  sigma_a_c: 8.49e-03   # accelerometer_noise_density from imu.yaml
  sigma_bg: 0.01
  sigma_ba: 0.1
  sigma_gw_c: 2.91e-04   # gyroscope_random_walk from imu.yaml
  sigma_aw_c: 4.92e-04   # accelerometer_random_walk from imu.yaml
  g: 9.81007
  g0: [0.0, 0.0, 0.0]
  a0: [0.0, 0.0, 0.0]
  s_a: [1.0, 1.0, 1.0]
  T_BS:
    [1.00000000, 0.00000000, 0.00000000, 0.00000000,
     0.00000000, 1.00000000, 0.00000000, 0.00000000,
     0.00000000, 0.00000000, 1.00000000, 0.00000000,
     0.00000000, 0.00000000, 0.00000000, 1.00000000]

frontend_parameters:
  detection_threshold: 50.0
  absolute_threshold: 20.0
  matching_threshold: 60.0
  octaves: 0
  max_num_keypoints: 400            # 700→400: 4相机×400=1600点/帧，足够VIO且快很多
  keyframe_overlap: 0.59
  use_cnn: 0
  parallelise_detection: 1
  num_matching_threads: 16           # 4→8: 24核机器充分利用

estimator_parameters:
  num_keyframes: 5
  num_loop_closure_frames: 5
  num_imu_frames: 3
  do_loop_closures: 0               # 关掉！回环触发全图优化会卡死，详见下方说明
  do_final_ba: 0                    # 关掉！5000帧全局BA极慢
  enforce_realtime: 1               # 限制每帧优化时间，防止越跑越慢
  realtime_min_iterations: 3
  realtime_max_iterations: 10
  realtime_time_limit: 0.035
  realtime_num_threads: 16           # 4→8: 优化求解多线程
  full_graph_iterations: 15
  full_graph_num_threads: 8         # 2→4: 全图优化多线程
  p_dbow: 0.4
  drift_percentage_heuristic: 1.35

output_parameters:
  display_topview: 1
  display_matches: 0                # 关掉匹配绘制，减少 GUI 开销
  display_overhead: 0
  enable_submapping: 0              # 无深度/LiDAR，关掉避免不必要计算
