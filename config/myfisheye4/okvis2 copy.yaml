       [-0.99988179, -0.01472396, -0.00442954, 0.01172090,
        -0.01498787, 0.86902809, 0.49453569, 0.05449041,
        -0.00343213, 0.49454361, -0.86914604, -0.00113350,
        0.00000000, 0.00000000, 0.00000000, 1.00000000],
     image_dimension: [960, 544],
     distortion_coefficients: [-0.01833434, 0.00297878, -0.00202312, 0.00009773],
     distortion_type: equidistant,
     focal_length: [258.28920053, 260.19480788],
     principal_point: [482.20826651, 301.66888090],
     cam_model: pinhole,
